<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Lume · Notch</title><link rel="stylesheet" href="notch.css"></head><body><div id="notch"><header><button id="collapse" title="Expandir ou recolher" aria-expanded="false">✳</button><span id="label">Lume por perto</span><button id="pin" title="Fixar acima das janelas" aria-pressed="true">⌖</button><button id="history" title="Histórico de insights">☷</button><button id="expand" title="Abrir Lume">↗</button><button id="close" title="Fechar Notch">×</button></header><main id="panel" hidden><nav aria-label="Ações rápidas"><button data-action="microphone">Microfone</button><button data-action="capture">Capturar tela</button><button data-action="analyze-clipboard">Analisar texto copiado</button><button data-action="new-session">Nova sessão</button><button data-action="assistant-select">Assistentes</button><button data-action="end-session">Encerrar sessão</button></nav><section aria-label="Teleprompter"><div class="tools"><label>Texto <input id="font" type="range" min="14" max="34" value="20"></label><label><input id="autoscroll" type="checkbox"> Rolagem automática</label><label><input id="clickthrough" type="checkbox"> Cliques fora dos controles</label></div><select id="session" aria-label="Sessão atual"></select><p id="insight" class="user-content" aria-live="polite">Os próximos insights da sessão aparecerão aqui.</p><ol id="insights" class="user-content" hidden></ol></section><p id="status" role="status"></p></main></div><script src="i18n.js"></script><script src="notch.js"></script></body></html>
